<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Toxic Language (Type 1)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-top: #1a1a1e;
        --bg-mid: #1a1a1e;
        --bg-bottom: #1a1a1e;
        --line: rgb(65 65 65 / 45%);
        --text: #f4f4f5;
        --muted: #a7a8b2;
        --accent: #626ff4;
        --danger: #a94b54;
        --positive: #1ac082;
        --shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Barlow", sans-serif;
        color: var(--text);
        background: #121214;
      }
      .app-shell {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        width: min(920px, calc(100vw - 2rem));
        height: min(92vh, 860px);
        border: none;
        border-radius: 14px;
        box-shadow: var(--shadow);
        background: #1a1a1e;
        overflow: hidden;
      }
      .panel { width: 100%; height: 100%; min-height: 0; }
      .hidden { display: none !important; }
      .splash-screen { display: grid; place-items: center; padding: clamp(1.5rem, 2vw, 2.5rem); }
      .splash-card {
        max-width: 620px;
        text-align: center;
        padding: clamp(1.6rem, 3vw, 2.8rem);
        border-radius: 24px;
        border: 1px solid #383943;
        background: #242429;
      }
      .kicker { margin: 0; text-transform: uppercase; letter-spacing: 0.14em; color: #a7a8b2; font-size: 0.75rem; }
      h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; margin: 0.65rem 0; }
      .lead { margin: 0 auto 1.8rem; max-width: 45ch; color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); }
      button { border: none; color: inherit; font: inherit; cursor: pointer; }
      .primary-btn {
        background: #5765f2;
        color: #fff;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.75rem 1.6rem;
      }
      .chat-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; overflow: hidden; background: #1a1a1e; }
      .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 0.95rem 1.1rem; border: none; background: #121214; margin: 5px; border-radius: 9px; }
      .channel-name { margin: 0; font-weight: 700; }
      .channel-subtitle { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9rem; }
      .ghost-btn { border-radius: 8px; background: #292a31; color: #f4f4f5; padding: 0.4rem 0.95rem; }
      .chat-log { min-height: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
      .message { display: flex; gap: 0.68rem; align-items: flex-start; }
      .message.you { flex-direction: row; }
      .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(140deg, #ffc14d, #ff7b4f); flex-shrink: 0; }
      .message.you .avatar { background: linear-gradient(140deg, #32d2ff, #1a7cf2); }
      .bubble-wrap { width: 100%; min-width: 0; max-width: min(78%, 660px); }
      .message.continuation .avatar,
      .message.continuation .meta { display: none; }
      .message.continuation .bubble-wrap { margin-left: calc(34px + 0.68rem); }
      .message.sender-change { margin-top: 1rem; }
      .meta { display: flex; gap: 0.55rem; align-items: center; margin-bottom: 0.2rem; }
      .author { font-weight: 700; font-size: 0.95rem; }
      .message.you .author { color: #7da2ff; }
      .time { color: var(--muted); font-size: 0.8rem; }
      .bubble { border-radius: 8px; border: none; background: transparent; color: var(--text); padding: 0px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble.continuation { margin-top: 0.35rem; }
      .message.typing .bubble { display: flex; gap: 0.35rem; align-items: center; min-height: 34px; min-width: 58px; }
      .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: #a7a8b2; animation: typing-pulse 900ms ease-in-out infinite; }
      .typing-dot:nth-child(2) { animation-delay: 140ms; }
      .typing-dot:nth-child(3) { animation-delay: 280ms; }
      .choices { max-height: 35vh; overflow-y: auto; border: none; padding: 7px; display: grid; align-content: start; gap: 0.6rem; background: #121214; border-radius: 9px; margin: 5px; }
      .choice-btn { width: 100%; text-align: left; border-radius: 4px; border: 1px solid #383943; background: #242429; padding: 0.72rem 0.82rem; color: var(--text); }
      .choice-btn.correct { border-color: rgba(26, 192, 130, 0.5); background: rgba(26, 192, 130, 0.18); }
      .choice-btn.wrong { border-color: rgba(169, 75, 84, 0.55); background: rgba(169, 75, 84, 0.18); }
      .choice-btn:disabled { opacity: 0.72; }
      .modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1000; padding: 1rem; }
      .modal.hidden { display: none !important; }
      .modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); }
      .modal-content { position: relative; display: flex; flex-direction: column; align-items: center; width: min(720px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); min-width: 0; background: #242429; border: 1px solid #42434c; border-radius: 12px; padding: clamp(1rem, 4vw, 2rem); text-align: center; box-shadow: var(--shadow); overflow: hidden; }
      .feedback-text { width: 100%; max-height: min(45vh, 360px); overflow: hidden; margin: 0 0 1.5rem; font-size: 1.05rem; line-height: 1.5; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
      .modal-close-btn { flex: 0 0 auto; background: #5765f2; color: #fff; font-weight: 600; border-radius: 8px; padding: 0.8rem 1.8rem; }
      .message.system { justify-content: center; }
      .message.system .avatar,
      .message.system .author,
      .message.system .time { display: none; }
      .message.system .bubble-wrap { flex: 1; width: 100%; max-width: none; text-align: center; }
      .message.system .bubble { display: block; width: min(100%, 600px); margin: 0 auto; opacity: 0.75; background: transparent; border: none; padding: 0; font-size: 0.95rem; color: #d0d1d8; text-align: center; }
      @keyframes typing-pulse {
        0%, 65%, 100% { transform: translateY(0); opacity: 0.4; }
        35% { transform: translateY(-3px); opacity: 1; }
      }
      @media (max-width: 680px) {
        .app-shell { width: 100vw; height: 100vh; border-radius: 0; border-left: none; border-right: none; }
        .bubble-wrap { max-width: 86%; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section id="splash-screen" class="panel splash-screen">
        <div class="splash-card">
          <p class="kicker">Training Scenario</p>
          <h1 id="scenario-title">Reporting Toxic Language (Type 1)</h1>
          <button id="begin-btn" class="primary-btn">Begin</button>
        </div>
      </section>
      <section id="chat-screen" class="panel chat-screen hidden" aria-label="Scenario chat">
        <header class="chat-header">
          <div>
            <p id="channel-name" class="channel-name">Reporting Toxic Language (Type 1)</p>
          </div>
          <button id="restart-btn" class="ghost-btn" type="button">Restart</button>
        </header>
        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
        <div id="choices" class="choices" role="group" aria-label="Available choices"></div>
      </section>
    </main>
    <div id="wrong-answer-modal" class="modal hidden" role="alertdialog" aria-live="assertive">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <p id="feedback-text" class="feedback-text"></p>
        <button id="modal-close-btn" class="modal-close-btn">Try again</button>
      </div>
    </div>
    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="bubble-wrap">
          <div class="meta">
            <span class="author"></span>
            <span class="time"></span>
          </div>
          <div class="bubble"></div>
        </div>
      </article>
    </template>
    <script>
      const scenario = {
  "startNodeId": "node-0",
  "nodes": {
    "node-0": {
      "messages": [
        {
          "from": "user",
          "text": "Hi, I'd like to report someone for being toxic in my DMs."
        },
        {
          "from": "system",
          "text": "You first search the user ID provided through the ticket screening for evidence of highly toxic behaviour within the server, and find nothing"
        }
      ],
      "options": [
        {
          "id": "option-0-0",
          "label": "\"Thank you for reaching out! Could I please see some evidence of this conversation?\"",
          "feedback": "You should always use /tag evidence as it provides the most up-to-date evidence requirements.",
          "correct": false,
          "next": "node-1"
        },
        {
          "id": "option-0-1",
          "label": "/tag evidence",
          "feedback": "",
          "correct": true,
          "next": "node-1"
        },
        {
          "id": "option-0-2",
          "label": "Escalate to higher ranks",
          "feedback": "While this is never not an option, this ticket can be handled by a moderator+. If you feel uncomfortable, ask another moderator to take over your ticket.",
          "correct": false,
          "next": "node-1"
        }
      ]
    },
    "node-1": {
      "messages": [
        {
          "from": "you",
          "text": "/tag evidence"
        },
        {
          "from": "user",
          "text": "[a recording of me declining a trade, where the other user then replies \"Well f*** you then.\" No further harassment is shown]"
        },
        {
          "from": "system",
          "text": "You analyse the video and conclude that it is real and valid"
        }
      ],
      "options": [
        {
          "id": "option-1-0",
          "label": "Moderate the user according to the moderation ladder",
          "feedback": "While mean, this behaviour does not meet the threshold for moderation, as it has not shown a repeated pattern and is not extreme discrimination",
          "correct": false,
          "next": "node-2"
        },
        {
          "id": "option-1-1",
          "label": "No Moderator action required",
          "feedback": "",
          "correct": true,
          "next": "node-2"
        }
      ]
    },
    "node-2": {
      "messages": [
        {
          "from": "you",
          "text": "[presses the close with reason button, and provide the following close reason:]"
        }
      ],
      "options": [
        {
          "id": "option-2-0",
          "label": "Thank you for your report, all appropriate actions have been taken. Have a wonderful day!",
          "feedback": "You are able to provide information that DMs are private, and that they should report the user through discord",
          "correct": false,
          "next": "node-3"
        },
        {
          "id": "option-2-1",
          "label": "Thank you for your report, unfortunately no action can be taken at this time. [DMs are private, please report the user to discord]",
          "feedback": "",
          "correct": true,
          "next": "node-3"
        }
      ]
    },
    "node-3": {
      "messages": [
        {
          "from": "you",
          "text": "Thank you for your report, unfortunately no action can be taken at this time. Discord DMs are private spaces not mediated by server rules; we recommend blocking or reporting the user."
        }
      ],
      "options": []
    }
  }
};
      const splashScreen = document.getElementById("splash-screen");
      const chatScreen = document.getElementById("chat-screen");
      const beginBtn = document.getElementById("begin-btn");
      const restartBtn = document.getElementById("restart-btn");
      const scenarioTitleEl = document.getElementById("scenario-title");
      const channelNameEl = document.getElementById("channel-name");
      const chatLog = document.getElementById("chat-log");
      const choicesEl = document.getElementById("choices");
      const messageTemplate = document.getElementById("message-template");
      const wrongAnswerModal = document.getElementById("wrong-answer-modal");
      const modalCloseBtn = document.getElementById("modal-close-btn");
      const modalBackdrop = wrongAnswerModal.querySelector(".modal-backdrop");
      if (scenarioTitleEl && channelNameEl) {
        channelNameEl.textContent = scenarioTitleEl.textContent || "Scenario";
      }
      let pendingNodeToken = 0;
      const MESSAGE_GAP_MS = 1000;
      const USER_TYPING_MS = 850;
      const YOU_TYPING_MS = 850;
      function wait(ms) { return new Promise((resolve) => window.setTimeout(resolve, ms)); }
      function getTimeStamp() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
      function pushMessage({ text, from = "user", isSystem = false }) {
        const fragment = messageTemplate.content.cloneNode(true);
        const message = fragment.querySelector(".message");
        const authorEl = fragment.querySelector(".author");
        const timeEl = fragment.querySelector(".time");
        const bubbleEl = fragment.querySelector(".bubble");
        const previousMessage = [...chatLog.children].reverse().find((item) =>
          item.classList.contains("message") && !item.classList.contains("typing")
        );
        if (
          !isSystem &&
          previousMessage?.classList.contains("message") &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender === from
        ) {
          bubbleEl.classList.add("continuation");
          bubbleEl.textContent = text;
          previousMessage.querySelector(".bubble-wrap").appendChild(bubbleEl);
          chatLog.scrollTop = chatLog.scrollHeight;
          return;
        }
        message.dataset.sender = from;
        if (
          !isSystem &&
          previousMessage &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender !== from
        ) {
          message.classList.add("sender-change");
        }
        if (from === "you") {
          message.classList.add("you");
        }
        if (isSystem) {
          message.classList.add("system");
        }
        authorEl.textContent = from === "you" ? "You" : "User";
        bubbleEl.textContent = text;
        timeEl.textContent = getTimeStamp();
        chatLog.appendChild(fragment);
        chatLog.scrollTop = chatLog.scrollHeight;
      }
      function showTypingIndicator({ author, from = "user" }) {
        const wrapper = document.createElement("article");
        wrapper.className = "message typing";
        wrapper.dataset.sender = from;
        const previousMessage = [...chatLog.children].reverse().find((item) =>
          item.classList.contains("message") && !item.classList.contains("typing")
        );
        if (
          previousMessage?.classList.contains("message") &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender === from
        ) {
          wrapper.classList.add("continuation");
        }
        if (from === "you") {
          wrapper.classList.add("you");
        }
        wrapper.innerHTML = '<div class="avatar"></div><div class="bubble-wrap"><div class="meta"><span class="author"></span><span class="time">typing...</span></div><div class="bubble" aria-label="typing indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
        if (
          previousMessage &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender !== from
        ) {
          wrapper.classList.add("sender-change");
        }
        wrapper.querySelector(".author").textContent = author;
        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
        return wrapper;
      }
      function showWrongAnswerModal(feedback) {
        document.getElementById("feedback-text").textContent = feedback || "Try a different option.";
        wrongAnswerModal.classList.remove("hidden");
      }
      function hideWrongAnswerModal() { wrongAnswerModal.classList.add("hidden"); }
      function renderOptions(node) {
        choicesEl.innerHTML = "";
        if (!node.options || node.options.length === 0) {
          const done = document.createElement("p");
          done.className = "channel-subtitle";
          done.textContent = "Scenario complete.";
          choicesEl.appendChild(done);
          requestAnimationFrame(() => {
            chatLog.scrollTop = chatLog.scrollHeight;
          });
          return;
        }
        node.options.forEach((option) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = option.label;
          btn.addEventListener("click", () => handleChoice(option, btn));
          choicesEl.appendChild(btn);
        });
        requestAnimationFrame(() => {
          chatLog.scrollTop = chatLog.scrollHeight;
        });
      }
      async function goToNode(nodeId) {
        const node = scenario.nodes[nodeId];
        if (!node) return;
        const myToken = ++pendingNodeToken;
        choicesEl.innerHTML = "";
        for (const [index, item] of (node.messages || []).entries()) {
          if (myToken !== pendingNodeToken) return;
          if (index > 0) {
            await wait(MESSAGE_GAP_MS);
            if (myToken !== pendingNodeToken) return;
          }
          const from = item.from || "user";
          const text = item.text || "";
          const isSystem = from === "system";
          if (!isSystem) {
            const typing = showTypingIndicator({
              author: from === "you" ? "You" : "User",
              from
            });
            await wait(from === "you" ? YOU_TYPING_MS : USER_TYPING_MS);
            if (myToken !== pendingNodeToken) {
              typing.remove();
              return;
            }
            typing.remove();
          }
          pushMessage({ text, from, isSystem });
        }
        renderOptions(node);
      }
      async function handleChoice(option, clickedBtn) {
        const buttons = Array.from(choicesEl.querySelectorAll(".choice-btn"));
        buttons.forEach((btn) => (btn.disabled = true));
        clickedBtn.classList.add(option.correct ? "correct" : "wrong");
        if (!option.correct) {
          showWrongAnswerModal(option.feedback);
          return;
        }
        await wait(250);
        void goToNode(option.next);
      }
      function startScenario() {
        splashScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        pendingNodeToken += 1;
        chatLog.innerHTML = "";
        void goToNode(scenario.startNodeId);
      }
      function handleModalClose() {
        hideWrongAnswerModal();
        const buttons = Array.from(choicesEl.querySelectorAll(".choice-btn"));
        buttons.forEach((btn) => (btn.disabled = false));
      }
      beginBtn.addEventListener("click", startScenario);
      restartBtn.addEventListener("click", startScenario);
      modalCloseBtn.addEventListener("click", handleModalClose);
      modalBackdrop.addEventListener("click", handleModalClose);
    </script>
  </body>
</html>
